name: Publish Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
        with:
          packages: 'platform-tools'
      - name: Restore the repository distribution signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dayframe-distribution-signing-v1
      - name: Refuse to publish with a missing signing identity
        run: |
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::No stable signing identity was found. Run Android CI successfully on main before tagging a release."
            exit 1
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Derive version from release tag
        id: version
        shell: bash
        run: |
          VERSION=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Use a version tag such as v1.0.1"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        run: |
          gradle --no-daemon --stacktrace \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}" \
            assembleRelease
      - name: Rename APK for release
        run: cp app/build/outputs/apk/release/app-release.apk "DAYFRAME-${{ steps.version.outputs.name }}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DAYFRAME ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: DAYFRAME-${{ steps.version.outputs.name }}.apk
